
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin Studio Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f3f3;color:#222;margin:0;padding:25px}
main{max-width:1000px;margin:auto}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0000000c}
input{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:11px 16px;background:#222;color:white;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.5}
.order{border:1px solid #ddd;padding:16px;border-radius:9px;margin:14px 0}
.designs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.designs a{display:inline-block;padding:10px 12px;background:#eee;border-radius:6px;color:#222;text-decoration:none}
.muted{color:#777;font-size:13px}
#status{margin:12px 0;font-weight:bold}
#orders{margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>Pin Studio Admin</h1>

  <section class="card" id="loginCard">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginButton">Log in</button>
    <div id="loginStatus"></div>
  </section>

  <section class="card" id="inbox" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h2>Orders</h2>
      <div>
        <button id="refreshButton">Refresh</button>
        <button id="logoutButton">Log out</button>
      </div>
    </div>
    <p class="muted">This page checks for new orders every 10 seconds while open.</p>
    <button id="notifyButton">Enable sound & notifications</button>
    <div id="status"></div>
    <div id="orders"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bwejkyftmqxdvlcsnwov.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NHwbzi01qt3ALn5aqTunzg_dPHlLwsC";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let newestSeen = null;
let soundEnabled = false;
let notificationEnabled = false;
let pollHandle = null;

const loginCard = document.getElementById("loginCard");
const inbox = document.getElementById("inbox");
const orders = document.getElementById("orders");
const statusBox = document.getElementById("status");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function playChime() {
  if (!soundEnabled) return;

  try {
    const audio = new AudioContext();
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.frequency.value = 880;
    gain.gain.value = 0.12;
    oscillator.start();
    oscillator.stop(audio.currentTime + 0.25);
    oscillator.onended = () => audio.close();
  } catch (error) {
    console.warn("Sound unavailable", error);
  }
}

function alertNewOrder(order) {
  playChime();

  if (notificationEnabled && Notification.permission === "granted") {
    new Notification("New Pin Studio Order", {
      body: `${order.customer_name} submitted a ${order.pin_count}-pin order.`
    });
  }
}

async function showOrders(isRefresh = false) {
  statusBox.textContent = "Loading orders...";

  const { data, error } = await db
    .from("pin_submissions")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    statusBox.textContent = "Could not load orders: " + error.message;
    return;
  }

  if (!data.length) {
    orders.innerHTML = "<p>No orders yet.</p>";
    statusBox.textContent = "Inbox is up to date.";
    return;
  }

  const latest = data[0];

  if (newestSeen && latest.id !== newestSeen && isRefresh) {
    const newestTime = new Date(latest.created_at).getTime();
    const previousTime = new Date(newestSeenTime).getTime();

    if (newestTime > previousTime) alertNewOrder(latest);
  }

  newestSeen = latest.id;
  newestSeenTime = latest.created_at;

  orders.innerHTML = "";

  for (const order of data) {
    const paths = order.design_paths?.length
      ? order.design_paths
      : (order.design_path ? [order.design_path] : []);

    const filenames = order.original_filenames?.length
      ? order.original_filenames
      : (order.original_filename ? [order.original_filename] : []);

    const card = document.createElement("article");
    card.className = "order";

    card.innerHTML = `
      <h3>${escapeHTML(order.customer_name || "Unnamed customer")}</h3>
      <p><strong>Package:</strong> ${escapeHTML(order.package_name || order.pin_count + " pins")}</p>
      <p><strong>Quantity:</strong> ${escapeHTML(order.pin_count ?? "Unknown")}</p>
      <p><strong>Total:</strong> $${escapeHTML(order.total_price ?? "Unknown")}</p>
      <p><strong>Contact:</strong> ${escapeHTML(order.contact_info || "Not provided")}</p>
      <p><strong>Notes:</strong> ${escapeHTML(order.notes || "None")}</p>
      <p><strong>Payment:</strong> CASH ONLY — acknowledged</p>
      <p class="muted">Submitted: ${escapeHTML(new Date(order.created_at).toLocaleString())}</p>
      <strong>Designs (${paths.length})</strong>
      <div class="designs" data-order-id="${escapeHTML(order.id)}"></div>
    `;

    orders.appendChild(card);

    const designContainer = card.querySelector(".designs");

    for (let i = 0; i < paths.length; i++) {
      const { data: signed, error: signedError } = await db.storage
        .from("pin-designs")
        .createSignedUrl(paths[i], 3600);

      const link = document.createElement("a");

      if (signedError) {
        link.textContent = `Design ${i + 1}: unavailable`;
        link.href = "#";
      } else {
        link.textContent = `Open Design ${i + 1}: ${filenames[i] || "Image"}`;
        link.href = signed.signedUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }

      designContainer.appendChild(link);
    }
  }

  statusBox.textContent = `${data.length} order(s) loaded.`;
}

let newestSeenTime = null;

document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const loginStatus = document.getElementById("loginStatus");

  loginStatus.textContent = "Logging in...";

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    loginStatus.textContent = error.message;
    return;
  }

  loginCard.hidden = true;
  inbox.hidden = false;

  await showOrders();

  if (pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(() => showOrders(true), 10000);
});

document.getElementById("refreshButton").addEventListener("click", () => {
  showOrders(true);
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  if (pollHandle) clearInterval(pollHandle);
  pollHandle = null;

  await db.auth.signOut();

  inbox.hidden = true;
  loginCard.hidden = false;
  orders.innerHTML = "";
  statusBox.textContent = "";
});

document.getElementById("notifyButton").addEventListener("click", async () => {
  soundEnabled = true;

  if ("Notification" in window) {
    const permission = await Notification.requestPermission();
    notificationEnabled = permission === "granted";
  }

  document.getElementById("notifyButton").textContent =
    notificationEnabled
      ? "Sound and notifications enabled"
      : "Sound enabled; browser notifications unavailable";
});

async function restoreSession() {
  const { data } = await db.auth.getSession();

  if (data.session) {
    loginCard.hidden = true;
    inbox.hidden = false;
    await showOrders();

    if (pollHandle) clearInterval(pollHandle);
    pollHandle = setInterval(() => showOrders(true), 10000);
  }
}

restoreSession();
</script>
</body>
</html>
